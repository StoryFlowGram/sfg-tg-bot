apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-service
  namespace: default
  labels:
    app: bot-service
    env: production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bot-service
  template:
    metadata:
      labels:
        app: bot-service
    spec:
      containers:
        - name: app
          image: bot-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: bot-service-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
