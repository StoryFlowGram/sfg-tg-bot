name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Р—Р°РІР°РЅС‚Р°Р¶СѓС”РјРѕ РєРѕРґ СЂРµРїРѕР·РёС‚РѕСЂС–СЋ
        uses: actions/checkout@v4

      - name: Р’СЃС‚Р°РЅРѕРІР»СЋС”РјРѕ Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Р’СЃС‚Р°РЅРѕРІР»СЋС”РјРѕ Poetry
        run: pip install poetry

      - name: Р’СЃС‚Р°РЅРѕРІР»СЋС”РјРѕ Р·Р°Р»РµР¶РЅРѕСЃС‚С– РїСЂРѕС”РєС‚Сѓ
  
        run: poetry install --no-interaction --no-root

      - name: РџС–РґРіРѕС‚РѕРІРєР° РґРѕ Р·Р±РёСЂР°РЅРЅСЏ Docker-РѕР±СЂР°Р·Сѓ
        id: prep
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Р’С…РѕРґРёРјРѕ РІ GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Р—Р±РёСЂР°С”РјРѕ Р№ РїСѓС€РёРјРѕ Docker-РѕР±СЂР°Р· Сѓ GCR
        uses: docker/build-push-action@v5
        with:
            context: .
            push: ${{ github.event_name != 'pull_request' }}
            tags: |
              ${{ steps.prep.outputs.image_id }}:latest
              ${{ steps.prep.outputs.image_id }}:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' 

    steps:
      - name: Р’РёРєРѕРЅСѓС”РјРѕ РґРµРїР»РѕР№ РЅР° СЃРµСЂРІРµСЂС–
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/deployer/sfg-app

            # Р’С…РѕРґРёРјРѕ РІ GHCR РЅР° СЃРµСЂРІРµСЂС–
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Р—Р°РІР°РЅС‚Р°Р¶СѓС”РјРѕ РЅРѕРІС– РІРµСЂСЃС–С— РѕР±СЂР°Р·С–РІ
            docker compose -f docker-compose-prod.yaml pull

            # РџРµСЂРµР·Р°РїСѓСЃРєР°С”РјРѕ СЃРµСЂРІС–СЃРё
            docker compose -f docker-compose-prod.yaml up -d --remove-orphans

            # РћС‡РёС‰Р°С”РјРѕ СЃС‚Р°СЂС– РѕР±СЂР°Р·Рё
            docker image prune -f


